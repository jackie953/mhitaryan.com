name: ESLint Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install project dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run your project's native Next.js ESLint configuration
      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx
